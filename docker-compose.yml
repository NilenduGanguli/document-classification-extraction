services:
  dce:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty by default, and that is the strongest control this service has: with no HTTP
        # client installed, the image *cannot* send a document anywhere. Set it to
        # "httpx>=0.27" only if you are enabling T2/T3/T4 below, or the REMOTE OCR provider
        # further down — and see the README section "What changes when you enable a paid
        # tier". Those are the only two reasons this line should ever be non-empty.
        EXTRA_PACKAGES: "${EXTRA_PACKAGES:-}"
    image: document-classification-extraction:0.1.0
    container_name: dce
    ports:
      - "8200:8200"
    environment:
      # Empty disables the X-API-Key gate — fine behind a service mesh that already
      # authenticates, not fine on anything reachable from a desk.
      API_KEY: "${API_KEY:-}"

      # THE INVARIANT. Leave this false. Turning it on lets unclassified document content
      # reach the network, which is the exact failure this service exists to prevent; it also
      # makes /readyz return 503, so the change is visible rather than quiet.
      ALLOW_PRECLASSIFICATION_EGRESS: "false"

      # Thresholds. Raising them raises the abstention rate (more human review, fewer silent
      # mistakes); lowering them does the opposite. Watch dce_classifications_total before
      # touching any of them.
      #
      # CLASSIFY_ACCEPT_PROBABILITY is deliberately NOT set here any more. It was an absolute
      # floor on a probability normalised over the whole registry, which made it a function of
      # how many doctypes were installed rather than of the document, and it has left the
      # accept path entirely (see docs/DESIGN.md §5.2). Setting it here would look like it
      # still did something.
      #
      # CLASSIFY_MIN_MARGIN is now the minimum lead on an absolute [0, 1] evidence channel,
      # not a difference of two registry-normalised probabilities. Its scale changed with its
      # meaning: the old 0.25 applied to this quantity abstains on essentially everything.
      CLASSIFY_MIN_MARGIN: "0.04"
      CLASSIFY_MIN_SUPPORT: "0.30"
      CLASSIFY_MIN_COVERAGE: "0.20"

      # ---- OCR: HOW AN IMAGE BECOMES TEXT, AND WHETHER IT LEAVES ------------------------
      # An image carries no text, so classifying one REQUIRES recognition, and recognition
      # happens either on this host or on somebody else's. There is no third option and this
      # block is where you pick. Leaving it exactly as it is gives you the default: images
      # and scanned PDFs come back as a structured `needs_ocr`, nothing is guessed at, and
      # nothing leaves.
      #
      # The BEST answer is usually not in this block at all: have whoever already holds the
      # document run Azure Read or Azure Layout under their own authorisation and POST the
      # result to /classify as `azure_analyze_result` (either product — the shape decides the
      # adapter), `azure_read_result` or `des_ocr`. Identical classification, and this
      # service opens no socket. The console's "Azure result" and "DES OCR" tabs are that
      # path.
      #
      # (a) LOCAL, in-process. Zero egress, materially lower accuracy. Needs the image to be
      #     rebuilt with the ocr-rapidocr or ocr-tesseract extra.
      DCE_INGEST_LOCAL_OCR_ENABLED: "${DCE_INGEST_LOCAL_OCR_ENABLED:-false}"
      DCE_INGEST_LOCAL_OCR_ENGINE: "${DCE_INGEST_LOCAL_OCR_ENGINE:-rapidocr}"
      #
      # (b) REMOTE. THIS SENDS DOCUMENTS NOBODY HAS CLASSIFIED YET out of this process, to be
      #     read by a service on the other end of a socket. Whether that is a third party or
      #     your own OCR appliance is declared below and is NOT something the code can work
      #     out. It is here because refusing to read an image is not the right answer for
      #     every deployment, and because a capability that has to be forked in is a
      #     capability nobody reviews. Three things are required and all three are visible:
      #     this flag, an endpoint, and an image rebuilt with EXTRA_PACKAGES="httpx>=0.27".
      #     /readyz then reports ocr.network=true, egress.preclassification_ocr=true, the
      #     endpoint host and the declared boundary. It cannot be combined with (a) — the
      #     container refuses to start rather than pick one silently.
      DCE_INGEST_REMOTE_OCR_ENABLED: "${DCE_INGEST_REMOTE_OCR_ENABLED:-false}"
      # azure_layout (Document Intelligence v4.0 prebuilt-layout) or azure_read (Vision Read
      # v3.2). Prefer layout: Read predicts no paragraph roles, so a Read payload can never
      # satisfy a title-gated decisive anchor and classifies on strictly less evidence.
      DCE_INGEST_REMOTE_OCR_PROVIDER: "${DCE_INGEST_REMOTE_OCR_PROVIDER:-azure_layout}"
      # Deliberately NOT the same variables as AZURE_DI_ENDPOINT/KEY below: sending a
      # document before its type is known and sending one after are two different
      # authorisations, and one variable granting both would let enabling T2 quietly enable
      # this. The keys belong in a secret store.
      #
      # Local mocks for both products live in the document-enrichment-services repo
      # (`docker compose up azure-ocr-mock azure-di-mock`) and listen on the host at
      # :5006 (Read v3.2) and :5007 (DI v4.0). From this container reach them at
      # http://host.docker.internal:5007 — never point a real deployment at a mock.
      DCE_INGEST_AZURE_DI_ENDPOINT: "${DCE_INGEST_AZURE_DI_ENDPOINT:-}"
      DCE_INGEST_AZURE_DI_KEY: "${DCE_INGEST_AZURE_DI_KEY:-}"
      DCE_INGEST_AZURE_DI_API_VERSION: "${DCE_INGEST_AZURE_DI_API_VERSION:-2024-11-30}"
      DCE_INGEST_AZURE_DI_MODEL: "${DCE_INGEST_AZURE_DI_MODEL:-prebuilt-layout}"
      DCE_INGEST_AZURE_READ_ENDPOINT: "${DCE_INGEST_AZURE_READ_ENDPOINT:-}"
      DCE_INGEST_AZURE_READ_KEY: "${DCE_INGEST_AZURE_READ_KEY:-}"
      #
      # WHERE THAT ENDPOINT SITS — a declaration, because it cannot be inferred.
      # `ocr.internal.corp` and `x.cognitiveservices.azure.com` are the same operation to this
      # service: resolve a name, open a socket, put a document on it. A hostname is not
      # evidence of ownership — private DNS can point `internal` at anything, and a private
      # endpoint can put a vendor domain inside your VPC — so the code will not guess. The
      # *code* default is `external`: a deployment that declares nothing gets the cautious
      # reading, never the reassuring one by omission.
      #
      # This compose file declares `on_premises` because that is what THIS deployment is: the
      # OCR and Azure services run inside the operator's own boundary, so the documents do not
      # reach a third party. Declaring it changes how /readyz READS — it stops describing an
      # internal hop as a transmission to a third party — and changes nothing about what the
      # process DOES: ocr.network and egress.preclassification_ocr stay true, the endpoint is
      # still named, and /readyz records that this value is the operator's declaration and not
      # something the service verified. Point this at a vendor endpoint, or at anything
      # outside your own network, and you must set `external`.
      DCE_INGEST_REMOTE_OCR_TRUST_BOUNDARY: "${DCE_INGEST_REMOTE_OCR_TRUST_BOUNDARY:-on_premises}"
      # Bounded twice on purpose: a caller is holding the request open, and `needs_ocr` is
      # where an unreadable document was going anyway.
      DCE_INGEST_REMOTE_OCR_TIMEOUT_SECONDS: "${DCE_INGEST_REMOTE_OCR_TIMEOUT_SECONDS:-30}"
      DCE_INGEST_REMOTE_OCR_MAX_POLLS: "${DCE_INGEST_REMOTE_OCR_MAX_POLLS:-60}"

      # ---- Optional local BERT tier (L3) -------------------------------------------------
      # Off by default. Enable it only if anchors + lexical prove insufficient on your corpus
      # — see README, "The optional local BERT tier". Uncomment BOTH this and the /models
      # volume below, and build the image with the `bert` extra installed.
      BERT_ENABLED: "false"
      # BERT_MODEL_DIR: "/models/bert_uncased_L-12_H-768_A-12"
      # BERT_DEVICE: "cpu"

      # ---- Extraction tiers 2-4: EGRESS AND SPEND. All off. -------------------------------
      # These run only AFTER a doctype is accepted, only over the fields the tiers before them
      # could not fill, and only on /process. Each one bills per page, per field or per token.
      # Leaving this block exactly as it is gives you a service that never calls anyone.
      #
      # Turning one on takes three steps, deliberately: set its flag, give it an endpoint, and
      # rebuild with EXTRA_PACKAGES="httpx>=0.27" — the image ships no HTTP client. /readyz
      # reports any tier that has one of the three and not the others.
      T2_ENABLED: "${T2_ENABLED:-false}"
      T3_ENABLED: "${T3_ENABLED:-false}"
      T4_ENABLED: "${T4_ENABLED:-false}"

      # Azure Document Intelligence — T2 (prebuilt specialists) and T3 (queryFields).
      # The KEY belongs in a secret store: this reads it from the environment so a compose
      # file can be committed, and nothing is written to the image.
      AZURE_DI_ENDPOINT: "${AZURE_DI_ENDPOINT:-}"
      AZURE_DI_KEY: "${AZURE_DI_KEY:-}"
      # Pinned, not "latest": a newer API version changes field names and confidence semantics
      # under a pipeline that has already been signed off.
      AZURE_DI_API_VERSION: "${AZURE_DI_API_VERSION:-2024-11-30}"
      # Azure bills per query field and caps them per request.
      T3_MAX_QUERY_FIELDS: "${T3_MAX_QUERY_FIELDS:-20}"

      # T4 — a schema-constrained LLM, last resort. Point LLM_BASE_URL at a self-hosted model
      # to keep documents inside your own boundary. Pin the model id: "whatever is newest" is
      # not a reproducible extraction contract.
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"

      # ---- T5: the human review queue ----------------------------------------------------
      # Not egress, and not optional — every abstention and every unverified required field
      # lands here. `memory` loses the queue on restart, which is honest for one replica and
      # wrong for anything real; `file` persists to the dce-data volume below. Anything
      # durable and shared implements dce.review.ReviewQueue and is yours to own.
      REVIEW_QUEUE_BACKEND: "${REVIEW_QUEUE_BACKEND:-memory}"
      REVIEW_QUEUE_PATH: "/app/data/review_queue.json"

      # ---- Second classification avenue --------------------------------------------------
      # VISUAL_METHOD is deliberately NOT set here, because there is nothing to set it to.
      # Four visual methods (SIFT/homography, glyph-stripped structure, layout signatures,
      # issuer-emblem matching) were each built and measured against the 158-document real
      # corpus; none reached the required 95% precision-when-answered at any threshold. Best
      # end-to-end result: 0.080. The lexical cascade on the same corpus: 0.983.
      # `dce.visual.AVENUES` is therefore empty and this setting has exactly one working
      # value, its default `none`. Setting it here would look like it did something.
      #
      # Naming one of the retired methods returns the measurement that retired it — that is
      # what it is for. See /readyz `second_avenue` for availability and registry coverage,
      # POST /api/v1/classify/compare for the comparison surface, and
      # docs/specs/2026-08-08-visual-classification-design.md §5B for the post-mortems.

    volumes:
      # The checkpoint is ~1.3 GB and optional, so it is mounted read-only rather than baked
      # into the image. Put it in ./models on the host and uncomment.
      # - ./models:/models:ro
      # The one writable path: the root filesystem is read-only, and the `file` review-queue
      # backend writes here.
      - dce-data:/app/data

    # Hardening. The service holds other people's unclassified documents in memory; there is
    # no reason for it to be able to write to its own filesystem or gain privileges.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    restart: unless-stopped

    # Classification is CPU-bound and single-pass; it wants cores, not memory. The ceiling is
    # generous enough for the optional BERT tier — halve it if you leave the tier off.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

volumes:
  dce-data:
