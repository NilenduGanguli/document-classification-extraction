services:
  dce:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # THE OCR STACK THIS DEPLOYMENT USES. Two things go in here and nothing else:
        #
        #   * rapidocr + onnxruntime — the in-process engine, so `rapidocr` in the console's
        #     provider picker is a real option rather than a greyed-out row;
        #   * httpx — the HTTP client the OCR service providers need to reach the OCR
        #     endpoints configured below.
        #
        # Leaving it EMPTY is still the strongest control this service has: with no HTTP
        # client installed the image *cannot* send a document anywhere, whatever a setting
        # says. This file is not that build — it is the in-network deployment, where OCR runs
        # inside the operator's own boundary — so the client is installed deliberately and
        # /readyz says so. If you want the zero-dependency build back, set EXTRA_PACKAGES=""
        # and turn the OCR block below off.
        #
        # Note what is still NOT here: nothing for the paid post-classification tiers beyond
        # the shared HTTP client. T2/T3/T4 remain off (see further down) and they are a
        # different authorisation — a vendor reading a document whose type is known — from an
        # OCR service on your own network reading one whose type is not.
        EXTRA_PACKAGES: "${EXTRA_PACKAGES:-rapidocr-onnxruntime>=1.3 onnxruntime>=1.17 numpy>=1.26 pillow>=10.3 httpx>=0.27}"
    image: document-classification-extraction:0.1.0
    container_name: dce
    ports:
      - "8200:8200"
    environment:
      # Empty disables the X-API-Key gate — fine behind a service mesh that already
      # authenticates, not fine on anything reachable from a desk.
      API_KEY: "${API_KEY:-}"

      # THE INVARIANT. Leave this false. Turning it on lets unclassified document content
      # reach the network, which is the exact failure this service exists to prevent; it also
      # makes /readyz return 503, so the change is visible rather than quiet.
      ALLOW_PRECLASSIFICATION_EGRESS: "false"

      # Thresholds. Raising them raises the abstention rate (more human review, fewer silent
      # mistakes); lowering them does the opposite. Watch dce_classifications_total before
      # touching any of them.
      #
      # CLASSIFY_ACCEPT_PROBABILITY is deliberately NOT set here any more. It was an absolute
      # floor on a probability normalised over the whole registry, which made it a function of
      # how many doctypes were installed rather than of the document, and it has left the
      # accept path entirely (see docs/DESIGN.md §5.2). Setting it here would look like it
      # still did something.
      #
      # CLASSIFY_MIN_MARGIN is now the minimum lead on an absolute [0, 1] evidence channel,
      # not a difference of two registry-normalised probabilities. Its scale changed with its
      # meaning: the old 0.25 applied to this quantity abstains on essentially everything.
      CLASSIFY_MIN_MARGIN: "0.04"
      LEXICAL_PRIMARY: "${LEXICAL_PRIMARY:-false}"
      CLASSIFY_MIN_SUPPORT: "0.30"
      CLASSIFY_MIN_COVERAGE: "0.20"

      # ---- OCR: HOW AN IMAGE BECOMES TEXT ------------------------------------------------
      # An image carries no text, so classifying one REQUIRES recognition, and recognition
      # happens either in this process or on another host. There is no third option and this
      # block is where you pick — or, as here, where you configure several and let each
      # request choose.
      #
      # THIS DEPLOYMENT CONFIGURES ALL OF THEM, because all of them run inside the operator's
      # own network: rapidocr in this container, and both Azure products against the local
      # mocks. Every entry in the console's provider picker is therefore selectable, and
      # `ingest.ocr_provider` on the API chooses between them per request. A pin can only ever
      # choose among what is configured here; it can never switch something on.
      #
      # There is still a path that involves no call from this process at all, and it is the
      # right answer for a deployment whose OCR lives somewhere this container cannot reach:
      # have whoever already holds the document run Azure Read or Azure Layout under their own
      # authorisation and POST the result to /classify as `azure_analyze_result` (either
      # product — the shape decides the adapter), `azure_read_result` or `des_ocr`. Identical
      # classification, and this service opens no socket. The console's "Azure result" and
      # "DES OCR" tabs are that path.
      #
      # (a) IN-PROCESS. Nothing is sent anywhere; materially lower accuracy than either Azure
      #     product. Needs the image built with rapidocr installed — see EXTRA_PACKAGES above.
      DCE_INGEST_LOCAL_OCR_ENABLED: "${DCE_INGEST_LOCAL_OCR_ENABLED:-true}"
      DCE_INGEST_LOCAL_OCR_ENGINE: "${DCE_INGEST_LOCAL_OCR_ENGINE:-rapidocr}"
      #
      # (b) OCR SERVICE. Documents nobody has classified yet are sent to the endpoints below to
      #     be read. Whose network those endpoints are on is declared further down and is NOT
      #     something the code can work out — here they are local mocks on this Mac, and in the
      #     cluster they are Azure pods beside this one. Three things are required and all
      #     three are visible: this flag, an endpoint per provider, and an image built with an
      #     HTTP client. /readyz then reports every configured provider, its endpoint host,
      #     ocr.network=true, egress.preclassification_ocr=true and the declared boundary.
      DCE_INGEST_OCR_SERVICE_ENABLED: "${DCE_INGEST_OCR_SERVICE_ENABLED:-true}"

      # --- Tracing -----------------------------------------------------------
      # DEBUG by default: full per-stage tracing of every request. One correlated line per
      # stage — ingest.start/done, segment.boundaries/done, classify.accept/abstain,
      # ocr.submit/poll/done, tier.billed — each prefixed req=<id> doc=<hash>, and the id is
      # echoed on the response as X-Request-Id so a caller can quote it.
      #
      # Verbose by design, and safe to leave on: no line carries document text, an extracted
      # field value or a filename. Set INFO to drop the per-poll and per-request chatter, or
      # WARNING for refusals and billing failures only.
      DCE_LOG_LEVEL: "${DCE_LOG_LEVEL:-DEBUG}"
      # NOT enabled by the line above, and deliberately so. This logs the WHOLE OCR response,
      # which IS the document's recognised text — on a KYC deployment that ships customer
      # names and ID numbers to wherever logs go. Raising a level to see stages should never
      # silently export PII, so it stays a separate, explicit switch: turn it on at a desk for
      # one document, then turn it off.
      DCE_INGEST_OCR_LOG_BODIES: "${DCE_INGEST_OCR_LOG_BODIES:-}"
      # azure_layout (Document Intelligence v4.0 prebuilt-layout) or azure_read (Vision Read
      # v3.2). Prefer layout: Read predicts no paragraph roles, so a Read payload can never
      # satisfy a title-gated decisive anchor and classifies on strictly less evidence. Both
      # are configured below; this names the one the service side runs by default.
      DCE_INGEST_OCR_SERVICE_PROVIDER: "${DCE_INGEST_OCR_SERVICE_PROVIDER:-azure_layout}"
      # With an in-process engine AND an OCR service both configured, one of them runs when a
      # request names no provider — and the code refuses to guess which, because preferring
      # either would silently override one of the two decisions. So it is declared. Set it to
      # `rapidocr` if you would rather an unpinned request stay in this process and only the
      # requests that ask go to the service.
      DCE_INGEST_OCR_DEFAULT_PROVIDER: "${DCE_INGEST_OCR_DEFAULT_PROVIDER:-azure_layout}"
      # Deliberately NOT the same variables as AZURE_DI_ENDPOINT/KEY below: reading a document
      # before its type is known and sending one to a paid vendor tier after are two different
      # authorisations, and one variable granting both would let enabling T2 quietly enable
      # this. The keys belong in a secret store; the mocks below need none.
      #
      # Local mocks for both products live in the document-enrichment-services repo
      # (`docker compose up azure-ocr-mock azure-di-mock`) and listen on the host at
      # :5006 (Read v3.2) and :5007 (DI v4.0). From this container they are reached at
      # host.docker.internal — never point a real deployment at a mock.
      DCE_INGEST_AZURE_DI_ENDPOINT: "${DCE_INGEST_AZURE_DI_ENDPOINT:-http://host.docker.internal:5007}"
      DCE_INGEST_AZURE_DI_KEY: "${DCE_INGEST_AZURE_DI_KEY:-}"
      DCE_INGEST_AZURE_DI_API_VERSION: "${DCE_INGEST_AZURE_DI_API_VERSION:-2024-11-30}"
      DCE_INGEST_AZURE_DI_MODEL: "${DCE_INGEST_AZURE_DI_MODEL:-prebuilt-layout}"
      DCE_INGEST_AZURE_READ_ENDPOINT: "${DCE_INGEST_AZURE_READ_ENDPOINT:-http://host.docker.internal:5006}"
      DCE_INGEST_AZURE_READ_KEY: "${DCE_INGEST_AZURE_READ_KEY:-}"
      #
      # WHERE THOSE ENDPOINTS SIT — a declaration, because it cannot be inferred.
      # `ocr.internal.corp` and `x.cognitiveservices.azure.com` are the same operation to this
      # service: resolve a name, open a socket, put a document on it. A hostname is not
      # evidence of ownership — private DNS can point `internal` at anything, and a private
      # endpoint can put a vendor domain inside your VPC — so the code will not guess. The
      # *code* default is `external`: a deployment that declares nothing gets the cautious
      # reading, never the reassuring one by omission.
      #
      # This compose file declares `on_premises` because that is what THIS deployment is: the
      # OCR services run inside the operator's own boundary, so documents never leave the
      # organisation's control. Declaring it changes how /readyz READS — the posture becomes a
      # description of how this deployment reads an image, not a warning about a disclosure —
      # and changes nothing about what the process DOES: ocr.network and
      # egress.preclassification_ocr stay true, the endpoint is still named, and /readyz
      # records that this value is the operator's declaration and not something the service
      # verified. Point this at a vendor endpoint, or at anything outside your own network,
      # and you must set `external`.
      DCE_INGEST_OCR_SERVICE_TRUST_BOUNDARY: "${DCE_INGEST_OCR_SERVICE_TRUST_BOUNDARY:-on_premises}"
      # Bounded twice on purpose: a caller is holding the request open, and `needs_ocr` is
      # where an unreadable document was going anyway.
      DCE_INGEST_OCR_SERVICE_TIMEOUT_SECONDS: "${DCE_INGEST_OCR_SERVICE_TIMEOUT_SECONDS:-30}"
      DCE_INGEST_OCR_SERVICE_MAX_POLLS: "${DCE_INGEST_OCR_SERVICE_MAX_POLLS:-60}"
      #
      # The DCE_INGEST_REMOTE_OCR_* names these replaced are still read as aliases, so an
      # existing .env keeps working; the service logs a line at boot naming any it finds.

      # ---- Optional local BERT tier (L3) -------------------------------------------------
      # Off by default. Enable it only if anchors + lexical prove insufficient on your corpus
      # — see README, "The optional local BERT tier". Uncomment BOTH this and the /models
      # volume below, and build the image with the `bert` extra installed.
      BERT_ENABLED: "false"
      # BERT_MODEL_DIR: "/models/bert_uncased_L-12_H-768_A-12"
      # BERT_DEVICE: "cpu"

      # ---- Extraction tiers 2-4: EGRESS AND SPEND. All off. -------------------------------
      # These run only AFTER a doctype is accepted, only over the fields the tiers before them
      # could not fill, and only on /process. Each one bills per page, per field or per token.
      # Leaving this block exactly as it is gives you a service that never calls anyone.
      #
      # Turning one on takes three steps, deliberately: set its flag, give it an endpoint, and
      # rebuild with EXTRA_PACKAGES="httpx>=0.27" — the image ships no HTTP client. /readyz
      # reports any tier that has one of the three and not the others.
      T2_ENABLED: "${T2_ENABLED:-false}"
      T3_ENABLED: "${T3_ENABLED:-false}"
      T4_ENABLED: "${T4_ENABLED:-false}"

      # Azure Document Intelligence — T2 (prebuilt specialists) and T3 (queryFields).
      # The KEY belongs in a secret store: this reads it from the environment so a compose
      # file can be committed, and nothing is written to the image.
      AZURE_DI_ENDPOINT: "${AZURE_DI_ENDPOINT:-}"
      AZURE_DI_KEY: "${AZURE_DI_KEY:-}"
      # Pinned, not "latest": a newer API version changes field names and confidence semantics
      # under a pipeline that has already been signed off.
      AZURE_DI_API_VERSION: "${AZURE_DI_API_VERSION:-2024-11-30}"
      # Azure bills per query field and caps them per request.
      T3_MAX_QUERY_FIELDS: "${T3_MAX_QUERY_FIELDS:-20}"

      # T4 — a schema-constrained LLM, last resort. Point LLM_BASE_URL at a self-hosted model
      # to keep documents inside your own boundary. Pin the model id: "whatever is newest" is
      # not a reproducible extraction contract.
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"

      # ---- T5: the human review queue ----------------------------------------------------
      # Not egress, and not optional — every abstention and every unverified required field
      # lands here. `memory` loses the queue on restart, which is honest for one replica and
      # wrong for anything real; `file` persists to the dce-data volume below. Anything
      # durable and shared implements dce.review.ReviewQueue and is yours to own.
      REVIEW_QUEUE_BACKEND: "${REVIEW_QUEUE_BACKEND:-memory}"
      REVIEW_QUEUE_PATH: "/app/data/review_queue.json"

      # ---- Second classification avenue --------------------------------------------------
      # VISUAL_METHOD is deliberately NOT set here, because there is nothing to set it to.
      # Four visual methods (SIFT/homography, glyph-stripped structure, layout signatures,
      # issuer-emblem matching) were each built and measured against the 158-document real
      # corpus; none reached the required 95% precision-when-answered at any threshold. Best
      # end-to-end result: 0.080. The lexical cascade on the same corpus: 0.983.
      # `dce.visual.AVENUES` is therefore empty and this setting has exactly one working
      # value, its default `none`. Setting it here would look like it did something.
      #
      # Naming one of the retired methods returns the measurement that retired it — that is
      # what it is for. See /readyz `second_avenue` for availability and registry coverage,
      # POST /api/v1/classify/compare for the comparison surface, and
      # docs/specs/2026-08-08-visual-classification-design.md §5B for the post-mortems.

    # host.docker.internal resolves on Docker Desktop; on Linux this maps it to the host so
    # the OCR endpoints above are reachable the same way on both.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # The checkpoint is ~1.3 GB and optional, so it is mounted read-only rather than baked
      # into the image. Put it in ./models on the host and uncomment.
      # - ./models:/models:ro
      # The one writable path: the root filesystem is read-only, and the `file` review-queue
      # backend writes here.
      - dce-data:/app/data

    # Hardening. The service holds other people's unclassified documents in memory; there is
    # no reason for it to be able to write to its own filesystem or gain privileges.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    restart: unless-stopped

    # Classification is CPU-bound and single-pass; it wants cores, not memory. The ceiling is
    # generous enough for the optional BERT tier — halve it if you leave the tier off.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

volumes:
  dce-data:
