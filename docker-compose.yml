services:
  dce:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty by default, and that is the strongest control this service has: with no HTTP
        # client installed, the image *cannot* send a document anywhere. Set it to
        # "httpx>=0.27" only if you are enabling T2/T3/T4 below — and see the README section
        # "What changes when you enable a paid tier".
        EXTRA_PACKAGES: "${EXTRA_PACKAGES:-}"
    image: document-classification-extraction:0.1.0
    container_name: dce
    ports:
      - "8200:8200"
    environment:
      # Empty disables the X-API-Key gate — fine behind a service mesh that already
      # authenticates, not fine on anything reachable from a desk.
      API_KEY: "${API_KEY:-}"

      # THE INVARIANT. Leave this false. Turning it on lets unclassified document content
      # reach the network, which is the exact failure this service exists to prevent; it also
      # makes /readyz return 503, so the change is visible rather than quiet.
      ALLOW_PRECLASSIFICATION_EGRESS: "false"

      # Thresholds. Raising them raises the abstention rate (more human review, fewer silent
      # mistakes); lowering them does the opposite. Watch dce_classifications_total before
      # touching any of them.
      #
      # CLASSIFY_ACCEPT_PROBABILITY is deliberately NOT set here any more. It was an absolute
      # floor on a probability normalised over the whole registry, which made it a function of
      # how many doctypes were installed rather than of the document, and it has left the
      # accept path entirely (see docs/DESIGN.md §5.2). Setting it here would look like it
      # still did something.
      #
      # CLASSIFY_MIN_MARGIN is now the minimum lead on an absolute [0, 1] evidence channel,
      # not a difference of two registry-normalised probabilities. Its scale changed with its
      # meaning: the old 0.25 applied to this quantity abstains on essentially everything.
      CLASSIFY_MIN_MARGIN: "0.04"
      CLASSIFY_MIN_SUPPORT: "0.30"
      CLASSIFY_MIN_COVERAGE: "0.20"

      # ---- Optional local BERT tier (L3) -------------------------------------------------
      # Off by default. Enable it only if anchors + lexical prove insufficient on your corpus
      # — see README, "The optional local BERT tier". Uncomment BOTH this and the /models
      # volume below, and build the image with the `bert` extra installed.
      BERT_ENABLED: "false"
      # BERT_MODEL_DIR: "/models/bert_uncased_L-12_H-768_A-12"
      # BERT_DEVICE: "cpu"

      # ---- Extraction tiers 2-4: EGRESS AND SPEND. All off. -------------------------------
      # These run only AFTER a doctype is accepted, only over the fields the tiers before them
      # could not fill, and only on /process. Each one bills per page, per field or per token.
      # Leaving this block exactly as it is gives you a service that never calls anyone.
      #
      # Turning one on takes three steps, deliberately: set its flag, give it an endpoint, and
      # rebuild with EXTRA_PACKAGES="httpx>=0.27" — the image ships no HTTP client. /readyz
      # reports any tier that has one of the three and not the others.
      T2_ENABLED: "${T2_ENABLED:-false}"
      T3_ENABLED: "${T3_ENABLED:-false}"
      T4_ENABLED: "${T4_ENABLED:-false}"

      # Azure Document Intelligence — T2 (prebuilt specialists) and T3 (queryFields).
      # The KEY belongs in a secret store: this reads it from the environment so a compose
      # file can be committed, and nothing is written to the image.
      AZURE_DI_ENDPOINT: "${AZURE_DI_ENDPOINT:-}"
      AZURE_DI_KEY: "${AZURE_DI_KEY:-}"
      # Pinned, not "latest": a newer API version changes field names and confidence semantics
      # under a pipeline that has already been signed off.
      AZURE_DI_API_VERSION: "${AZURE_DI_API_VERSION:-2024-11-30}"
      # Azure bills per query field and caps them per request.
      T3_MAX_QUERY_FIELDS: "${T3_MAX_QUERY_FIELDS:-20}"

      # T4 — a schema-constrained LLM, last resort. Point LLM_BASE_URL at a self-hosted model
      # to keep documents inside your own boundary. Pin the model id: "whatever is newest" is
      # not a reproducible extraction contract.
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"

      # ---- T5: the human review queue ----------------------------------------------------
      # Not egress, and not optional — every abstention and every unverified required field
      # lands here. `memory` loses the queue on restart, which is honest for one replica and
      # wrong for anything real; `file` persists to the dce-data volume below. Anything
      # durable and shared implements dce.review.ReviewQueue and is yours to own.
      REVIEW_QUEUE_BACKEND: "${REVIEW_QUEUE_BACKEND:-memory}"
      REVIEW_QUEUE_PATH: "/app/data/review_queue.json"

    volumes:
      # The checkpoint is ~1.3 GB and optional, so it is mounted read-only rather than baked
      # into the image. Put it in ./models on the host and uncomment.
      # - ./models:/models:ro
      # The one writable path: the root filesystem is read-only, and the `file` review-queue
      # backend writes here.
      - dce-data:/app/data

    # Hardening. The service holds other people's unclassified documents in memory; there is
    # no reason for it to be able to write to its own filesystem or gain privileges.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    restart: unless-stopped

    # Classification is CPU-bound and single-pass; it wants cores, not memory. The ceiling is
    # generous enough for the optional BERT tier — halve it if you leave the tier off.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

volumes:
  dce-data:
