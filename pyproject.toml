[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-classification-extraction"
version = "0.1.0"
description = "In-process document classification and field extraction for unclassified documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# Base dependencies — deliberately small, and deliberately WITHOUT an HTTP client.
#
# There is no httpx / requests / aiohttp here, and no vendor SDK. That is not an oversight:
# other business units send this service documents that have not been classified, and shipping
# their bytes (or their text, or an embedding of their text) to a third party before we know
# what the document is, is the exact failure the service exists to prevent. Classification runs
# entirely in this process. If you find yourself adding an HTTP client to satisfy something in
# the classification path, that thing belongs somewhere else. See docs/DESIGN.md.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",       # fuzzy label matching in the label-anchored locator (pure local)
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# The optional LOCAL BERT tier (L3). Off by default; enable only if anchors + lexical prove
# insufficient on your corpus. The model is NOT baked into the image — it is mounted read-only
# at /models (see docker-compose.yml), because it is ~1.3 GB and most deployments never use it.
#
# NOTE: the published `bert_uncased_L-12_H-768_A-12` checkpoint ships TensorFlow + Flax weights
# and no PyTorch bin/safetensors, so transformers must load it with `from_tf=True` (needs
# `tensorflow`) or `from_flax=True` (needs `jax` + `flax`). Neither is listed here, because
# which one you want depends on your base image and CPU:
#     pip install '.[bert]' tensorflow-cpu        # from_tf=True
#     pip install '.[bert]' jax flax              # from_flax=True
# Converting the checkpoint to safetensors once, offline, and mounting that is faster and
# smaller than either — and keeps the runtime free of a second framework.
bert = [
    "transformers>=4.44",
    "torch>=2.3",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    # Test-only. fastapi.testclient is built on httpx, so it is here and NOT in the base deps:
    # the runtime image must not contain an HTTP client that the classification path could
    # reach for. tests/test_api.py asserts that no engine module imports one.
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["dce"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except — every `except Exception` must justify itself with a noqa
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends()/Header() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
