[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-classification-extraction"
version = "0.1.0"
description = "In-process document classification and field extraction for unclassified documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# Base dependencies — deliberately small, and deliberately WITHOUT an HTTP client.
#
# There is no httpx / requests / aiohttp here, and no vendor SDK. That is not an oversight:
# other business units send this service documents that have not been classified, and shipping
# their bytes (or their text, or an embedding of their text) to a third party before we know
# what the document is, is the exact failure the service exists to prevent. Classification runs
# entirely in this process. If you find yourself adding an HTTP client to satisfy something in
# the classification path, that thing belongs somewhere else. See docs/DESIGN.md.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",       # fuzzy label matching in the label-anchored locator (pure local)
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# The optional LOCAL BERT tier (L3). Off by default; enable only if anchors + lexical prove
# insufficient on your corpus. The model is NOT baked into the image — it is mounted read-only
# at /models (see docker-compose.yml), because it is ~1.3 GB and most deployments never use it.
#
# NOTE: the published `bert_uncased_L-12_H-768_A-12` checkpoint ships TensorFlow + Flax weights
# and no PyTorch bin/safetensors, so transformers must load it with `from_tf=True` (needs
# `tensorflow`) or `from_flax=True` (needs `jax` + `flax`). Neither is listed here, because
# which one you want depends on your base image and CPU:
#     pip install '.[bert]' tensorflow-cpu        # from_tf=True
#     pip install '.[bert]' jax flax              # from_flax=True
# Converting the checkpoint to safetensors once, offline, and mounting that is faster and
# smaller than either — and keeps the runtime free of a second framework.
bert = [
    "transformers>=4.44",
    "torch>=2.3",
]
# ---------------------------------------------------------------------------
# INGESTION EXTRAS (dce.ingest) — accepting the formats a KYC pipeline actually receives.
#
# The base install already parses DOCX, XLSX, PPTX, ODT, RTF, TXT, CSV, HTML, EML and MSG
# with the STANDARD LIBRARY ALONE: zipfile + xml.etree for the office formats, `email` for
# messages, html.parser for markup, and a compound-file reader in dce/ingest/cfb.py for
# Outlook .msg. None of the packages below are needed for any of those. What the extras buy
# is the two things the standard library cannot do — read a PDF, and read pixels.
# ---------------------------------------------------------------------------

#: PDF text layers. Also what tools/corpus_test.py has always needed and never declared.
pdf = [
    "pymupdf>=1.24",
]

# ---- LOCAL OCR: OPTIONAL, OFF BY DEFAULT, AND NEVER A NETWORK CALL ---------
# An image carries no text, so classifying one *requires* recognition — and the accurate
# recognisers are cloud services, which is the exact egress this service exists to prevent.
# The default answer is therefore an honest, structured `needs_ocr`, not a guess. A deployment
# that has accepted the accuracy trade installs one of these engines and sets
# DCE_INGEST_LOCAL_OCR_ENABLED=true; both run on this host and open no socket. An engine that
# needs an endpoint does not belong here — it belongs after classification, with T2/T3/T4.

#: RapidOCR under ONNX Runtime — genuinely in-process. The recommended engine.
ocr-rapidocr = [
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "pillow>=10.3",
]
#: Tesseract via pytesseract. Zero-egress too, but it shells out to a LOCAL BINARY you must
#: install separately (`brew install tesseract`, `apt install tesseract-ocr`) — a subprocess,
#: not an in-process library. Offered for its language packs; see dce/ingest/ocr.py, which
#: states the distinction rather than hiding it behind the word "local".
ocr-tesseract = [
    "pytesseract>=0.3.10",
    "pillow>=10.3",
]

dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    # The ingestion suite builds its own DOCX/XLSX/PPTX/ODT/MSG/PNG/TIFF fixtures byte by
    # byte (tests/ingest_fixtures.py) and needs no office library; it does need a PDF engine
    # for the PDF cases, which is the `pdf` extra above.
    "pymupdf>=1.24",
    # Test-only. fastapi.testclient is built on httpx, so it is here and NOT in the base deps:
    # the runtime image must not contain an HTTP client that the classification path could
    # reach for. tests/test_api.py asserts that no engine module imports one.
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["dce"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except — every `except Exception` must justify itself with a noqa
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends()/Header() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
